name: Build Hermes Arch ISO

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-hermes-archiso.yml'
      - 'assemble-installer.sh'
      - 'installer-parts/**'
      - 'installer.sha256'
      - 'build-iso.sh'
      - 'verify-iso.sh'
      - 'overlay/**'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/build-hermes-archiso.yml'
      - 'assemble-installer.sh'
      - 'installer-parts/**'
      - 'installer.sha256'
      - 'build-iso.sh'
      - 'verify-iso.sh'
      - 'overlay/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  build-iso:
    name: Build and verify ISO
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Prepare Arch Linux build container
        run: pacman -Syu --noconfirm --needed git archiso libarchive squashfs-tools

      - name: Check out build package
        uses: actions/checkout@v4

      - name: Assemble and validate installer
        run: |
          chmod +x assemble-installer.sh build-iso.sh verify-iso.sh overlay/usr/local/sbin/hermes-installer-launch tests/test-installer-startup.sh
          ./assemble-installer.sh
          ./tests/test-installer-startup.sh hermes-install.sh
          bash -n build-iso.sh
          bash -n verify-iso.sh
          bash -n overlay/usr/local/sbin/hermes-installer-launch

      - name: Build and verify custom ISO
        run: ./build-iso.sh

      - name: Show completed files
        run: |
          ls -lh out/
          sha256sum -c out/*.iso.sha256

      - name: Upload finished ISO
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hermes-archiso-${{ github.run_number }}
          path: |
            out/*.iso
            out/*.iso.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
