name: Debug Hermes Codex OAuth on minimal Arch

on:
  push:
    branches:
      - debug/hermes-bootstrap-127

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install live-environment tools
        run: |
          pacman -Syu --noconfirm --needed arch-install-scripts curl ca-certificates

      - name: Create the same minimal target and install Hermes
        shell: bash
        run: |
          mkdir -p /target
          pacstrap -K /target \
            base linux linux-firmware iwd curl ca-certificates git base-devel
          rm -f /target/etc/resolv.conf
          cp -L /etc/resolv.conf /target/etc/resolv.conf
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh \
            -o /target/root/hermes-agent-install.sh
          chmod 700 /target/root/hermes-agent-install.sh
          arch-chroot /target /bin/bash /root/hermes-agent-install.sh \
            --skip-setup --skip-browser --skip-computer-use --no-skills
          rm -f /target/root/hermes-agent-install.sh
          arch-chroot /target hermes --version

      - name: Exercise ChatGPT Codex device-code auth until prompt
        shell: bash
        run: |
          set +e
          timeout 25s arch-chroot /target /bin/bash -lc \
            'unset OPENAI_API_KEY; hermes auth add openai-codex --no-browser' \
            2>&1 | tee /tmp/codex-auth.log
          rc=${PIPESTATUS[0]}
          echo "CODEX_AUTH_EXIT=$rc"
          echo "----- captured output -----"
          cat /tmp/codex-auth.log
          # timeout(124) is success for this diagnostic if the command reached
          # an interactive device-code wait. A clean immediate failure is not.
          if [[ $rc -eq 124 || $rc -eq 0 ]]; then
            exit 0
          fi
          exit "$rc"
