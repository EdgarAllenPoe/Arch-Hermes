name: Debug Hermes bootstrap exit 127

on:
  push:
    branches:
      - debug/hermes-bootstrap-127

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install live-environment tools
        run: |
          pacman -Syu --noconfirm --needed arch-install-scripts curl ca-certificates

      - name: Create the same minimal target root
        shell: bash
        run: |
          mkdir -p /target
          pacstrap -K /target \
            base linux linux-firmware iwd curl ca-certificates git base-devel
          rm -f /target/etc/resolv.conf
          cp -L /etc/resolv.conf /target/etc/resolv.conf
          curl -fsSL https://hermes-agent.nousresearch.com/install.sh \
            -o /target/tmp/hermes-agent-install.sh
          chmod 700 /target/tmp/hermes-agent-install.sh
          ls -l /target/tmp/hermes-agent-install.sh

      - name: Run the exact arch-chroot Hermes command with tracing
        shell: bash
        run: |
          set +e
          arch-chroot /target /bin/bash -lc \
            'bash -x /tmp/hermes-agent-install.sh --skip-setup --skip-browser --skip-computer-use --no-skills' \
            2>&1 | tee /tmp/hermes-bootstrap.log
          rc=${PIPESTATUS[0]}
          echo "HERMES_INSTALL_EXIT=$rc"
          echo "----- final 200 lines -----"
          tail -n 200 /tmp/hermes-bootstrap.log
          exit "$rc"
